<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
            background: #1a1a1a;
          }
          a {
            color: #1a1a1a;
            text-decoration: none;
          }
          a:hover {
            color: #555;
          }
        </style>
      </helmet>
      <div
        style="background:{{ theme.pageBg }}; min-height:100vh; padding:32px 24px; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;"
      >
        <div
          style="max-width:960px; margin:0 auto; background:{{ theme.cardBg }}; border-radius:2px; overflow:hidden;"
        >
          <nav
            style="display:flex; align-items:center; justify-content:space-between; padding:28px 40px; border-bottom:1px solid {{ theme.border }};"
          >
            <div style="font-size:19px; color:{{ theme.text }};">
              Michael Kim
            </div>
            <div style="display: flex; gap: 36px; align-items: center">
              <a
                href="index.dc.html"
                style="font-size:17px; color:{{ theme.textMuted }};"
                >Home</a
              >
              <a
                href="https://linkedin.com/in/placeholder"
                target="_blank"
                rel="noopener"
                style="font-size:17px; color:{{ theme.textMuted }};"
                >LinkedIn</a
              >
              <a
                href="resume.dc.html"
                style="font-size:17px; font-weight:600; color:{{ theme.text }};"
                >Resume</a
              >
              <a
                href="contact.dc.html"
                style="font-size:17px; color:{{ theme.textMuted }};"
                >Contact</a
              >
              <button
                onClick="{{ toggleDark }}"
                style="font-size:14px; font-weight:600; color:{{ theme.text }}; background:transparent; border:1px solid {{ theme.border }}; border-radius:14px; padding:6px 14px; cursor:pointer;"
              >
                {{ theme.toggleLabel }}
              </button>
            </div>
          </nav>

          <div
            style="
              padding: 56px 40px;
              display: flex;
              flex-direction: column;
              align-items: center;
            "
          >
            <h1
              style="font-size:32px; font-weight:500; margin:0 0 24px; color:{{ theme.text }};"
            >
              Resume
            </h1>
            <div
              style="width:100%; max-width:640px; background:{{ theme.placeholderBg }}; border-radius:4px; padding:80px 24px; display:flex; align-items:center; justify-content:center; margin-bottom:28px;"
            >
              <span
                style="font-family:monospace; font-size:13px; color:{{ theme.textMuted }};"
                >resume preview / PDF embed</span
              >
            </div>
            <a
              href="#"
              download
              style="font-size:15px; font-weight:600; color:{{ theme.cardBg }}; background:{{ theme.text }}; padding:12px 28px; border-radius:3px;"
              >Download PDF</a
            >
          </div>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script>
      class Component extends DCLogic {
        state = { dark: localStorage.getItem('site-dark') === null ? true : localStorage.getItem('site-dark') === '1' };

        toggleDark() {
          this.setState(s => {
            const dark = !s.dark;
            localStorage.setItem('site-dark', dark ? '1' : '0');
            return { dark };
          });
        }

        getTheme() {
          const dark = this.state.dark;
          return dark ? {
            pageBg: '#000', cardBg: '#1a1a1a', text: '#f2f2f2', textMuted: '#aaa',
            border: '#333', placeholderBg: '#2a2a2a', toggleLabel: 'Light mode'
          } : {
            pageBg: '#1a1a1a', cardBg: '#fff', text: '#1a1a1a', textMuted: '#555',
            border: '#e2e2e2', placeholderBg: '#d9d9d9', toggleLabel: 'Dark mode'
          };
        }

        renderVals() {
          return { theme: this.getTheme(), toggleDark: () => this.toggleDark() };
        }
      }
    </script>
  </body>
</html>
